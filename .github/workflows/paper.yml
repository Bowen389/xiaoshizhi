name: Double-low 200k paper simulation
on:
  push:
    branches: [main]
    paths: ['*.py', 'tests/**', '.github/workflows/**']
  workflow_dispatch:
    inputs:
      phase:
        description: '阶段；auto按北京时间决定，不支持伪造历史日期'
        type: choice
        default: auto
        options: [auto, preflight, open, watch, close]
  schedule:
    - cron: '20 1 * * 1-5'  # 09:20 Asia/Shanghai: preflight
    - cron: '31 1 * * 1-5'  # 09:31: opening-price paper model
    - cron: '50 6 * * 1-5'  # 14:50: mark / overdue opening recovery
    - cron: '20 7 * * 1-5'  # 15:20: closing-price paper model and daily screen
    - cron: '50 7 * * 1-5'  # 15:50: closing retry / idempotent recovery
permissions:
  contents: write
concurrency:
  group: double-low-paper-main
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate strategy and accounting
        run: python -m unittest discover -s tests -v
      - name: Run scheduled paper account
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_PHASE: ${{ inputs.phase }}
        shell: bash
        run: |
          phase="auto"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            phase="$REQUESTED_PHASE"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            case "$SCHEDULE" in
              '20 1 * * 1-5') phase="preflight" ;;
              '31 1 * * 1-5') phase="open" ;;
              '50 6 * * 1-5') phase="watch" ;;
              *) phase="close" ;;
            esac
          fi
          python run.py --phase "$phase"
      - name: Save account and frozen signals
        run: |
          git config user.name "xiaoshizhi-paper[bot]"
          git config user.email "xiaoshizhi-paper@users.noreply.github.com"
          git add data reports
          if ! git diff --cached --quiet; then
            git commit -m "paper: persist signals and account [skip ci]"
            git push origin HEAD:main
          fi
      - name: Publish run summary
        if: always()
        run: |
          if [ -f reports/latest.md ]; then cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f reports/last_error.json ]; then cat reports/last_error.json >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-audit-${{ github.run_id }}
          path: |
            data/
            reports/
          retention-days: 30
